[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-hermes"
version = "0.1.0"
description = "Intelligent hiking route planning system"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Project Hermes Team"}
]
keywords = ["hiking", "routing", "trails", "osm", "gps"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "pydantic==2.6.0",
    "pydantic-settings==2.1.0",
    "networkx==3.2.1",
    "osmnx==1.9.0",
    "geopy==2.4.1",
    "shapely==2.0.2",
    "pyproj==3.6.1",
    "gpxpy==1.6.2",
    "elevation==1.1.3",
    "srtm.py==0.3.7",
    "numpy==1.26.3",
    "pandas==2.2.0",
    "python-dotenv==1.0.1",
    "loguru==0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.0.0",
    "pytest-asyncio==0.23.4",
    "pytest-cov",
    "httpx==0.26.0",
    "black",
    "isort",
    "flake8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=app --cov-report=html --cov-report=term"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
